<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MES Thermaclim</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MES">
<meta name="theme-color" content="#1a9a9f">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--c:#1a8f99;--c2:#e8f5f6;--bg:#f3f5f7;--card:#fff;--tx:#1d2329;--mu:#6b7680;--bd:#dde3e8;--ok:#2e8b57;--err:#c0392b;--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#121619;--card:#1c2226;--tx:#e8edf0;--mu:#93a0aa;--bd:#2d363c;--c2:#16343a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--c);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:15px}
main{padding:12px 12px calc(110px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin:0 0 10px}
.list .card{display:flex;align-items:center;gap:10px;cursor:pointer}
.list .card .t{flex:1;min-width:0}
.t b{display:block;overflow:hidden;text-overflow:ellipsis}
.mu{color:var(--mu);font-size:13px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);margin:18px 4px 8px}
label.f{display:block;margin:0 0 10px}
label.f span{display:block;font-size:13px;color:var(--mu);margin:0 0 3px}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
textarea{min-height:90px}
input:focus,textarea:focus{outline:2px solid var(--c);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;background:var(--c);color:#fff;cursor:pointer}
.btn.sec{background:var(--c2);color:var(--c)}
.btn.del{background:transparent;color:var(--err);border:1px solid var(--err)}
.btn.sm{padding:7px 10px;font-size:14px;border-radius:9px}
.btn.wide{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:6}
.bar .btn{flex:1}
.mrow{border-left:4px solid var(--c)}
.mrow .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mrow .hd b{flex:1}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.photos img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.ph{position:relative}
.ph button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--err);color:#fff;font-size:13px;line-height:22px;padding:0}
.camb{background:var(--c2);color:var(--c);border:0;border-radius:9px;padding:6px 10px;font-size:14px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--bg);border-radius:20px;padding:8px 14px;font:inherit;color:var(--tx)}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.sig{background:#fff;border:1px dashed var(--bd);border-radius:10px;min-height:70px;display:flex;align-items:center;justify-content:center}
.sig img{max-height:80px;max-width:100%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
canvas.pad{width:100%;height:220px;background:#fff;border:1px solid var(--bd);border-radius:10px;touch-action:none}
.badge{font-size:12px;border-radius:10px;padding:2px 8px;background:var(--c2);color:var(--c);white-space:nowrap}
.chk{width:26px;height:26px;flex:0 0 26px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:30;font-size:14px;max-width:90%}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.off{background:#b9770e;color:#fff;font-size:12px;text-align:center;padding:3px}
</style>
</head>
<body>
<div id="app"></div>
<script src="pdf-lib.min.js"></script>
<script src="app.js"></script>
</body>
</html>
